# Synchronisation GitHub vers Hugging Face Spaces.
#
# A chaque poussee sur main, le depot part vers le Space, qui reconstruit son
# image et redemarre tout seul. Plus rien a faire a la main.
#
# Deux reglages a poser une seule fois, dans les parametres du depot GitHub,
# rubrique Settings puis Secrets and variables puis Actions :
#
#   * un SECRET nomme HF_TOKEN : un jeton d'ecriture cree sur
#     huggingface.co/settings/tokens, de type « Write ».
#   * une VARIABLE nommee HF_SPACE : le chemin du Space, par exemple
#     Banibe/nodjal, tel qu'il apparait dans son adresse.
#
# Ce qui part vers le Space est un COMMIT ORPHELIN unique, pas notre
# historique. Deux raisons, et la seconde a coute deux echecs avant d'etre
# comprise :
#
#   1. le Space n'a aucun besoin de connaitre l'histoire du projet ;
#   2. Hugging Face refuse les fichiers binaires en git ordinaire et reclame
#      Git LFS. Convertir les images en LFS dans un nouveau commit ne suffit
#      pas : la poussee emporte aussi les commits anterieurs, ou les memes
#      images figurent encore en clair, et le crochet de reception les voit.
#      Un commit orphelin n'a pas de passe, donc plus rien a voir.

name: Vers Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule synchronisation a la fois : deux poussees rapprochees ne doivent
# pas se marcher dessus sur le Space.
concurrency:
  group: sync-hugging-face
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier que les reglages sont poses
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "La variable HF_SPACE est vide. Posez-la dans Settings, Secrets and variables, Actions, onglet Variables."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "Le secret HF_TOKEN est vide. Posez-le dans Settings, Secrets and variables, Actions, onglet Secrets."
            exit 1
          fi
          echo "Cible : $HF_SPACE"

      - name: Composer le commit orphelin et pousser
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git lfs install --local

          # Une branche sans parent : le contenu reste, l'historique disparait.
          git checkout --orphan espace

          # Le suivi LFS est declare AVANT le premier ajout, sinon les images
          # entrent en clair et le crochet de reception refuse la poussee.
          git lfs track "*.jpg" "*.jpeg" "*.png" "*.webp" "*.gif" "*.woff2" "*.woff" "*.pdf" "*.mp4" "*.zip" "*.docx" "*.bin"

          # On vide l'index puis on le remplit : sans cela les fichiers deja
          # indexes ne repassent pas par le filtre de nettoyage de LFS.
          # -f leve le garde-fou de git : --cached ne touche que l index,
          # jamais les fichiers du disque.
          git rm -r --cached . -q -f
          git add -A

          git -c user.name="Nodjal" -c user.email="ci@nodjal.invalid" \
              commit -q -m "Nodjal, synchronise depuis GitHub"

          echo "--- fichiers suivis par LFS ---"
          git lfs ls-files

          git push --force "https://Banibe:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" espace:main
