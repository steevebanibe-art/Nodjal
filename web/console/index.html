<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console du donneur d'ordre — Nodjal</title>
<meta name="description" content="Espace du donneur d'ordre : jalons, preuves, faisceau, certificat d'avancement, libération.">
<meta name="theme-color" content="#F6F3EC">
<link rel="stylesheet" href="/shared/nodjal.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231A1814'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23F6F3EC' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  .atelier { display: grid; gap: clamp(1.4rem, 3vw, 2.4rem); align-items: start; }
  @media (min-width: 68rem) { .atelier { grid-template-columns: 21rem 1fr; } }

  .etat-bande {
    background: var(--nuit); color: rgba(246,243,236,.72);
    font-family: var(--machine); font-size: .66rem; letter-spacing: .06em;
    padding: .45rem 0;
  }
  .etat-bande .colonne { display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: center; }
  .etat-bande b { color: var(--papier); font-weight: 500; }
  .etat-off { color: #D9A34E; }

  .synthese { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
  .synthese div span {
    display: block; font-family: var(--machine); font-size: .61rem; letter-spacing: .13em;
    text-transform: uppercase; color: var(--discret); margin-bottom: .3rem;
  }
  .synthese div strong { font-family: var(--display); font-size: 1.5rem; font-weight: 400; letter-spacing: -.02em; }

  .attaques { display: grid; gap: .5rem; }
  .journal { max-height: 26rem; overflow: auto; }
  .journal li {
    display: grid; grid-template-columns: 5.6rem 1fr; gap: .8rem;
    padding: .5rem 0; border-top: 1px solid var(--filet-fin); font-size: .82rem;
  }
  .journal li:first-child { border-top: none; }
  .journal time { font-family: var(--machine); font-size: .68rem; color: var(--discret); }
  .journal code { font-family: var(--machine); font-size: .7rem; color: var(--foret); }

  .empreinte {
    font-family: var(--machine); font-size: .68rem; word-break: break-all;
    color: var(--encre-pale); line-height: 1.5;
  }
  dialog {
    border: 1px solid var(--filet); border-radius: var(--rayon); padding: 0;
    background: var(--papier-vif); color: var(--encre); max-width: min(44rem, 92vw);
  }
  dialog::backdrop { background: rgba(20,18,15,.55); backdrop-filter: blur(3px); }
  .modale { padding: clamp(1.3rem, 3vw, 2rem); }
</style>
</head>
<body>

<div class="etat-bande"><div class="colonne" id="bande">Chargement de l'état des composants…</div></div>

<header class="bandeau">
  <div class="colonne bandeau__interieur">
    <a class="marque" href="/">Nodjal <span>console du donneur d'ordre</span></a>
    <nav class="nav">
      <a href="/">Public</a>
      <a href="/console" aria-current="page">Console</a>
      <a href="/terrain">Terrain</a>
    </nav>
  </div>
</header>

<main class="colonne section--serree pile" style="--ecart:1.8rem" id="racine">
  <p class="mention">Chargement du chantier…</p>
</main>

<dialog id="modale"><div class="modale" id="modale-corps"></div></dialog>

<script type="module" src="/console/console.js"></script>
</body>
</html>
