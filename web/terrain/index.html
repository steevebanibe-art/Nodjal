<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nodjal Terrain</title>
<meta name="description" content="Application de terrain : prises de vue imposées, position, cap, file d'attente hors ligne.">
<meta name="theme-color" content="#1A1814">
<link rel="stylesheet" href="/shared/nodjal.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231A1814'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23F6F3EC' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  body { background: var(--nuit); color: var(--papier); }
  .telephone {
    max-width: 26rem; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--nuit);
  }
  .barre {
    padding: .9rem 1.15rem; border-bottom: 1px solid rgba(246,243,236,.12);
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  }
  .barre__marque { font-family: var(--display); font-size: 1.05rem; letter-spacing: .05em; }
  .barre__etat { font-family: var(--machine); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; }
  .en-ligne { color: #8FC6A8; }
  .hors-ligne { color: #D9A34E; }

  .corps { flex: 1; padding: 1.15rem; display: flex; flex-direction: column; gap: 1.1rem; }

  .avertissement {
    border: 1px solid rgba(217,163,78,.42); background: rgba(217,163,78,.08);
    border-radius: var(--rayon); padding: .8rem .9rem;
    font-size: .8rem; line-height: 1.5; color: #E7CC96;
  }

  .capteurs { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .capteur {
    border: 1px solid rgba(246,243,236,.13); border-radius: var(--rayon);
    padding: .55rem .6rem; background: rgba(246,243,236,.03);
  }
  .capteur span {
    display: block; font-family: var(--machine); font-size: .54rem;
    letter-spacing: .13em; text-transform: uppercase; color: rgba(246,243,236,.42);
  }
  .capteur strong {
    display: block; font-family: var(--machine); font-size: .84rem;
    font-weight: 500; margin-top: .22rem; color: var(--papier);
  }

  .prise {
    border: 1px solid rgba(246,243,236,.13); border-radius: var(--rayon);
    padding: .85rem .95rem; display: grid; gap: .6rem;
    background: rgba(246,243,236,.03);
  }
  .prise--faite { border-color: rgba(143,198,168,.42); background: rgba(47,107,79,.12); }
  .prise__tete { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; }
  .prise__nom { font-family: var(--display); font-size: 1.02rem; }
  .prise__cap { font-family: var(--machine); font-size: .64rem; color: rgba(246,243,236,.5); letter-spacing: .09em; }
  .prise__apercu { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 2px; border: 1px solid rgba(246,243,236,.13); }

  .boussole { width: 100%; aspect-ratio: 3/1; }
  .boussole line, .boussole circle { vector-effect: non-scaling-stroke; }

  .file {
    border-top: 1px solid rgba(246,243,236,.12); padding-top: .9rem;
    font-size: .8rem; color: rgba(246,243,236,.62);
  }
  .file li { display: flex; justify-content: space-between; gap: .8rem; padding: .3rem 0; font-family: var(--machine); font-size: .68rem; }

  .bouton--terrain {
    --fond: var(--foret); --texte-bouton: #06110B;
    width: 100%; justify-content: center; padding: .95rem; font-size: .78rem;
  }
  .bouton--fantome {
    --fond: transparent; --texte-bouton: var(--papier);
    border-color: rgba(246,243,236,.24); box-shadow: none; width: 100%; justify-content: center;
  }
  input[type=file] { display: none; }
  .pied-terrain { padding: 1rem 1.15rem 1.6rem; font-size: .72rem; color: rgba(246,243,236,.4); line-height: 1.55; border-top: 1px solid rgba(246,243,236,.12); }
  .pied-terrain a { color: rgba(246,243,236,.68); }
</style>
</head>
<body>
<div class="telephone">
  <div class="barre">
    <span class="barre__marque">Nodjal <span style="font-family:var(--machine);font-size:.58rem;letter-spacing:.14em;color:rgba(246,243,236,.4)">TERRAIN</span></span>
    <span class="barre__etat en-ligne" id="reseau">EN LIGNE</span>
  </div>
  <div class="corps" id="corps">
    <p class="mention" style="color:rgba(246,243,236,.5)">Chargement du chantier…</p>
  </div>
  <div class="pied-terrain">
    Version navigateur, destinée à la démonstration. L'application de production est native
    (Expo / React Native) : c'est la seule surface qui peut lire le drapeau
    <span class="machine">isFromMockProvider</span> et l'attestation d'intégrité de l'appareil.
    · <a href="/console">Console</a> · <a href="/">Public</a>
  </div>
</div>
<input type="file" id="fichier" accept="image/*" capture="environment">
<script type="module" src="/terrain/terrain.js"></script>
</body>
</html>
